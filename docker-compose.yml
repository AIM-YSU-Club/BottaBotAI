services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: bottabot_api
    ports:
      - "8000:8000"
    volumes:
      - ./bottabot:/app/bottabot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
      - redis
    restart: always

  reranker_worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.reranker
    container_name: worker_reranker
    command: celery -A bottabot.celery.app worker -Q reranker_queue --loglevel=info -c 1
    volumes:
      - ./bottabot:/app/bottabot
      - ./hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PYTHONUNBUFFERED=1
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    platform: linux/amd64
    restart: always
    depends_on:
      - ollama
      - redis

  docling_worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.docling
    container_name: worker_docling
    command: celery -A bottabot.celery.app worker -Q docling_queue --loglevel=info -c 1
    volumes:
      - ./bottabot:/app/bottabot
      - ./docling_cache:/root/.cache
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PYTHONUNBUFFERED=1
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    platform: linux/amd64
    restart: always
    depends_on:
      - ollama
      - redis

  ollama:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ollama
    container_name: ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: always
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - ./redis_data:/data
    restart: always
