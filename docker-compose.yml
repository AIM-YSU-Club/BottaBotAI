services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: bottabot_api
    ports:
      - "8000:8000"
    volumes:
      - ./bottabot:/app/bottabot
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

  docling_worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.docling
    container_name: worker_docling
    command: celery -A bottabot.celery.app worker -Q docling_queue --loglevel=info -c 1
    volumes:
      - ./bottabot:/app/bottabot
      - ./docling_cache:/root/.cache
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - PYTHONUNBUFFERED=1
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    platform: linux/amd64
    restart: always
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ollama
    container_name: ai_ollama
    ports:
      - "11434:11434"
    volumes:
      # 모델 가중치/매니페스트 영속화. 엔트리포인트가 여기에 pull 한다.
      - ./ollama_data:/root/.ollama
    env_file:
      # .env 의 OLLAMA_EMBEDDING_MODEL / OLLAMA_CHAT_LLM / OLLAMA_SUMMARY_LLM 사용
      - .env
    healthcheck:
      # .env 의 임베딩 모델이 준비됐는지 확인 (엔트리포인트 pull 완료 신호)
      test: ["CMD-SHELL", "ollama list | grep -Fq \"$$OLLAMA_EMBEDDING_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: always