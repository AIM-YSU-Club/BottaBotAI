services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: bottabot_api
    ports:
      - "8000:8000"
    volumes:
      - ./bottabot:/app/bottabot
      - ./hf_cache:/opt/huggingface
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/opt/huggingface
      - TRANSFORMERS_CACHE=/opt/huggingface
      - HUGGINGFACE_HUB_CACHE=/opt/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    restart: always

  docling_worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.docling
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
    container_name: worker_docling
    command: celery -A bottabot.celery.app worker -Q docling_queue --loglevel=info -c 1
    volumes:
      - ./bottabot:/app/bottabot
      - ./docling_cache:/root/.cache
      - ./hf_cache:/opt/huggingface
    env_file:
      - .env
    environment:
      - HF_HOME=/opt/huggingface
      - TRANSFORMERS_CACHE=/opt/huggingface
      - HUGGINGFACE_HUB_CACHE=/opt/huggingface
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    platform: linux/amd64
    restart: always
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ollama
    container_name: ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-models-ready && ollama list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    # NVIDIA GPU 가속을 위한 설정
    # GPU가 없거나 Mac 환경에서는 주석 처리
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
              
    restart: always
